name: CS:GO base Win32 build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Win32)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build Release DLL
        run: cmake --build build --config Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: csgo-base-win32
          path: build/Release/csgo_base.dll
          if-no-files-found: error

  fatality-port-check:
    # This staged port is not yet used by the DLL. Keep its compilation
    # separate so a porting failure does not block the existing release.
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure staged Win32 GUI
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DBUILD_FATALITY_PORT_CHECK=ON
      - name: Compile staged GUI and DX9 renderer
        run: cmake --build build --config Release --target fatality_port_check
