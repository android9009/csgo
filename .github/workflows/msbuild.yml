name: Airflow Win32 build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - name: Install D3DX development files
        shell: pwsh
        run: |
          nuget install Microsoft.DXSDK.D3DX -Version 9.29.952.8 -OutputDirectory packages
          $dx = Resolve-Path "packages/Microsoft.DXSDK.D3DX.9.29.952.8/build/native"
          "DXSDK_Dir=$dx\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Airflow Debug Win32
        shell: pwsh
        run: |
          msbuild opaihook.vcxproj /m /p:Configuration=Debug /p:Platform=Win32 /v:minimal /fl "/flp:logfile=msbuild.log;verbosity=normal"
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $errors = Select-String -Path msbuild.log -Pattern '(?:fatal )?error [A-Z]+[0-9]+:'
            if ($errors) {
              $errors | Select-Object -First 80 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            } else {
              Get-Content msbuild.log -Tail 40 | ForEach-Object { Write-Host "::error::$_" }
            }
          }
          exit $buildExit

      - name: Upload Airflow DLL
        uses: actions/upload-artifact@v4
        with:
          name: airflow-recode-win32
          path: Bins/csgo_debug.dll
          if-no-files-found: error
