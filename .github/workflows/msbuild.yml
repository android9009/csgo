name: Airflow shell Win32 build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build Darkside GUI DLL
        run: msbuild opaihook.sln /m /p:Configuration=Release /p:Platform=x86 /v:minimal

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: airflow-shell-win32
          path: Bins/airflow_shell.dll
          if-no-files-found: error
