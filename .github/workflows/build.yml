name: Airflow shell Win32 build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build Darkside GUI DLL
        run: msbuild airflow.sln /m /p:Configuration=Release /p:Platform=x86 /v:minimal /flp:LogFile=build.log;Verbosity=normal

      - name: Surface build errors
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            Get-Content build.log | Select-String ": error " | Select-Object -First 8 | ForEach-Object { Write-Host ("::error::" + $_.Line.Trim()) }
          }

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: airflow-shell-win32
          path: Bins/airflow_shell.dll
          if-no-files-found: error
