    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 22px; color: #b4bac8; }

    figcaption { padding-top: 8px; text-align: center; font-size: 13px; }
    a { color: #a9c7ff; }
  </style>
</head>
